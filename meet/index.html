<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>EnerInfra — POWERBOARD</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html{color-scheme:light dark;background:#fff}
:root{--navy:#0E1B33;--blue:#14346E;--amber:#F2A31B;--ink:#12161F;--ink2:#5B6474;--ink3:#8A93A3;--line:#E5E8EE;--paper:#fff;--soft:#F5F7FA;
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--ease:cubic-bezier(.22,.9,.35,1)}
@media (prefers-color-scheme: dark){:root{--ink:#F2F5F9;--ink2:#B6BECC;--ink3:#8A93A3;--line:rgba(255,255,255,.13);--paper:#0E1B33;--soft:#13233F}html,body{background:#0E1B33}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.75;-webkit-font-smoothing:antialiased}
main{max-width:660px;margin:0 auto;padding:22px 20px 96px}
.lang{display:flex;gap:6px;justify-content:flex-end;margin:0 0 20px}
.lang button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:5px 13px;cursor:pointer;transition:.2s var(--ease)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme: dark){.lang button[aria-pressed=true]{background:var(--amber);color:#0E1B33;border-color:var(--amber)}}
.greet{border-left:5px solid var(--amber);padding:4px 0 4px 16px;margin:0 0 26px}
.greet h1{font-size:25px;line-height:1.35;margin:0 0 5px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.greet p{margin:0;color:var(--ink2);font-size:15px}
.voice{display:flex;align-items:center;gap:11px;margin:0 0 40px;flex-wrap:wrap}
.voice button{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
@media (prefers-color-scheme: dark){.voice button{background:var(--amber);color:#0E1B33}}
.voice span{color:var(--ink3);font-size:13px}
section{margin:0 0 52px}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--amber);font-weight:700;margin:0 0 10px}
h2{font-size:26px;line-height:1.3;letter-spacing:-.03em;margin:0 0 14px;font-weight:700}
.p{color:var(--ink2);font-size:15.5px;margin:0}
figure{margin:22px 0 0}
figure img{width:100%;border-radius:16px;box-shadow:0 18px 40px -18px rgba(14,27,51,.28)}
figcaption{margin-top:9px;font-size:12.5px;color:var(--ink3);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 0}
.stat{border:1px solid var(--line);border-radius:16px;padding:18px 16px;background:var(--soft)}
.stat b{display:block;font-size:30px;letter-spacing:-.03em;color:var(--ink);font-weight:700;line-height:1.2}
.stat small{display:block;color:var(--ink3);font-size:12.5px;margin-top:5px;line-height:1.5}
.steps{counter-reset:s;margin:20px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 0 44px;margin:0 0 20px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
@media (prefers-color-scheme: dark){.steps li::before{background:var(--amber);color:#0E1B33}}
.steps b{display:block;font-size:16px;margin-bottom:2px}
.steps span{color:var(--ink2);font-size:14.5px}
.rows{margin:20px 0 0;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:15px 2px;border-bottom:1px solid var(--line)}
.row span{color:var(--ink2);font-size:14px;flex:1}
.row b{font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.row b.big{color:var(--amber)}
ul.ticks{margin:18px 0 0;padding:0;list-style:none}
ul.ticks li{position:relative;padding:0 0 0 26px;margin:0 0 11px;color:var(--ink2);font-size:15px}
ul.ticks li::before{content:'';position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.mem{padding:15px 0;border-bottom:1px solid var(--line)}
.mem b{display:block;font-size:15.5px}
.mem span{color:var(--ink2);font-size:14px}
.ask{background:var(--soft);border-radius:20px;padding:26px 22px}
.nav{display:grid;gap:10px;margin:22px 0 0}
.nav a{display:block;padding:15px 18px;border:1.5px solid var(--navy);border-radius:14px;color:var(--navy);text-decoration:none;font-weight:700;font-size:15px;transition:.2s var(--ease)}
.nav a.solid{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){.nav a{border-color:var(--amber);color:var(--amber)}.nav a.solid{background:var(--amber);color:#0E1B33;border-color:var(--amber)}}
.note{font-size:12.5px;color:var(--ink3);margin:10px 2px 0}
.contact{border-top:2px solid var(--navy);padding-top:20px;font-size:14.5px}
@media (prefers-color-scheme: dark){.contact{border-top-color:var(--amber)}}
.contact a{color:inherit}
.contact .adr{color:var(--ink2);font-size:13.5px;margin-top:7px}
footer{margin-top:40px;color:var(--ink3);font-size:12.5px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="lang" role="group"><button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="ko">한국어</button></div>

  <div class="greet"><h1 id="g1"></h1><p id="g2"></p></div>
  <div class="voice"><button id="play"></button><span id="vnote"></span><audio id="voice" src="voice_ja.mp3" preload="none"></audio></div>

  <section>
    <p class="k" data-t="lead_k"></p><h2 data-t="lead_h" data-html="1"></h2><p class="p" data-t="lead_p"></p>
    <figure><img src="../img/prototype.jpg" loading="lazy" alt="POWERBOARD"><figcaption data-t="cap"></figcaption></figure>
  </section>

  <section>
    <p class="k" data-t="why_k"></p><h2 data-t="why_h" data-html="1"></h2><p class="p" data-t="why_p"></p>
    <div class="two">
      <div class="stat"><b data-t="s1v"></b><small data-t="s1"></small></div>
      <div class="stat"><b data-t="s2v"></b><small data-t="s2"></small></div>
    </div>
  </section>

  <section>
    <p class="k" data-t="how_k"></p><h2 data-t="how_h"></h2>
    <ol class="steps">
      <li><b data-t="h1"></b><span data-t="h1p"></span></li>
      <li><b data-t="h2"></b><span data-t="h2p"></span></li>
      <li><b data-t="h3"></b><span data-t="h3p"></span></li>
    </ol>
  </section>

  <section>
    <p class="k" data-t="num_k"></p><h2 data-t="num_h"></h2>
    <div class="rows">
      <div class="row"><span data-t="n1"></span><b class="big" data-t="n1v"></b></div>
      <div class="row"><span data-t="n2"></span><b data-t="n2v"></b></div>
      <div class="row"><span data-t="n3"></span><b data-t="n3v"></b></div>
      <div class="row"><span data-t="n4"></span><b data-t="n4v"></b></div>
    </div>
  </section>

  <section>
    <p class="k" data-t="tr_k"></p><h2 data-t="tr_h"></h2>
    <ul class="ticks"><li data-t="t1"></li><li data-t="t2"></li><li data-t="t3"></li><li data-t="t4"></li></ul>
  </section>

  <section>
    <p class="k" data-t="team_k"></p><h2 data-t="team_h"></h2>
    <div class="mem"><b data-t="m1"></b><span data-t="m1p"></span></div>
    <div class="mem"><b data-t="m2"></b><span data-t="m2p"></span></div>
    <div class="mem"><b data-t="m3"></b><span data-t="m3p"></span></div>
  </section>

  <section class="ask">
    <p class="k" data-t="ask_k"></p><h2 data-t="ask_h" data-html="1"></h2><p class="p" data-t="ask_p"></p>
  </section>

  <section>
    <div class="nav">
      <a class="solid" id="n-site" href="../"></a>
      <a id="n-live" href="live.html"></a>
      <a id="n-ar" href="ar.html"></a>
    </div>
    <p class="note" data-t="deck_note"></p>
  </section>

  <section class="contact">
    <p class="k" data-t="c_h"></p>
    <div data-t="c_n"></div>
    <div><a href="tel:+821088324530">+82 10 8832 4530</a> · <a href="mailto:dbdhkswo@naver.com">dbdhkswo@naver.com</a></div>
    <div class="adr" data-t="c_a"></div>
  </section>

  <footer>EnerInfra Inc. · POWERBOARD · See it. Save it.</footer>
</main>

const P = new URLSearchParams(location.search);
const to = P.get('to');
let L = ['ja','en','ko'].includes(P.get('lang')) ? P.get('lang')
      : (function(){try{const v=localStorage.getItem('ei_lang');return ['ja','en','ko'].includes(v)?v:'ja';}catch(e){return 'ja';}})();

function apply(){
  const d = T[L] || T.ja;
  document.documentElement.lang = L;
  try{ localStorage.setItem('ei_lang', L); }catch(e){}
  const g = (to && d.greet[to]) ? d.greet[to] : [d.title, d.sub];
  document.getElementById('g1').textContent = g[0];
  document.getElementById('g2').textContent = g[1];
  document.getElementById('play').textContent = d.play;
  document.getElementById('vnote').textContent = d.vnote;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = d[el.getAttribute('data-t')];
    if(v===undefined) return;
    if(el.getAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  const q = '?lang='+L + (to ? '&to='+to : '');
  document.getElementById('n-site').textContent = d.b_site;
  document.getElementById('n-site').href = '../?lang='+L;
  document.getElementById('n-live').textContent = d.b_live;
  document.getElementById('n-live').href = 'live.html'+q;
  document.getElementById('n-ar').textContent = d.b_ar;
  document.getElementById('n-ar').href = 'ar.html'+q;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===L)));
  try{ const u=new URLSearchParams(location.search); u.set('lang',L); history.replaceState(null,'','?'+u.toString()); }catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{ L=b.dataset.lang; apply(); }));
apply();

const a=document.getElementById('voice'), b=document.getElementById('play');
b.addEventListener('click',()=>{
  const d=T[L]||T.ja;
  if(a.paused){ a.play().then(()=>{b.textContent=d.stop;}).catch(()=>{b.textContent=d.prep;}); }
  else { a.pause(); b.textContent=d.play; }
});
a.addEventListener('ended',()=>{ b.textContent=(T[L]||T.ja).play; });
</script>
