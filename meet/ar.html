<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>POWERBOARD — AR</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@3/dist/model-viewer.min.js"></script>
<style>
html{color-scheme:light dark;background:#fff}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;color:#1c1c1e}
main{max-width:640px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;color:#0E1B33;margin:0 0 6px}p{color:#5b6170;margin:0 0 16px;line-height:1.7}
model-viewer{width:100%;height:70vh;background:#f3f4f7;border-radius:16px}
model-viewer::part(default-ar-button){display:none}
.ar{display:block;margin:16px 0 0;padding:16px;text-align:center;border-radius:14px;background:#0E1B33;color:#fff;font-weight:700;border:0;width:100%;font:inherit;font-weight:700;cursor:pointer}
a{color:#0E1B33}
@media (prefers-color-scheme: dark){html,body{background:#fff}}
</style>
</head>
<body><main>
<h1 id="t1"></h1>
<p id="t2"></p>
<model-viewer id="mv" src="powerboard.glb" alt="POWERBOARD 3D model" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls auto-rotate shadow-intensity="1" exposure="1.1"></model-viewer>
<button class="ar" type="button" onclick="document.getElementById('mv').activateAR()" id="arbtn"></button>
<p id="t3" style="margin-top:14px;font-size:14px"></p>
<p><a id="back" href="index.html"></a></p>
<script>const L=(new URLSearchParams(location.search).get('lang'))||'ja';const T={ja:{t1:'机の上に置いてみてください。',t2:'実物大のPOWERBOARD（175×140×26mm）です。「ARで見る」を押すとカメラが開き、目の前の机や壁に本体が現れます。アプリは不要です。',b:'ARで見る（カメラを起動）',t3:'iPhoneはSafari、AndroidはChromeでご覧ください。',back:'← 会社案内へ戻る'},en:{t1:'Put it on your desk.',t2:'A life-size POWERBOARD (175×140×26 mm). Tap "View in AR" to open the camera and place it on the desk or wall in front of you. No app needed.',b:'View in AR (opens camera)',t3:'Use Safari on iPhone, Chrome on Android.',back:'← Back to company profile'},ko:{t1:'책상 위에 올려 보세요.',t2:'실물 크기 POWERBOARD(175×140×26mm)입니다. "AR로 보기"를 누르면 카메라가 열리고 눈앞의 책상이나 벽에 본체가 나타납니다. 앱은 필요 없습니다.',b:'AR로 보기 (카메라 실행)',t3:'아이폰은 Safari, 안드로이드는 Chrome에서 보세요.',back:'← 회사 소개로 돌아가기'}}[L];for(const k of ['t1','t2','t3'])document.getElementById(k).textContent=T[k];document.getElementById('arbtn').textContent=T.b;document.getElementById('back').textContent=T.back;document.getElementById('back').href='index.html?lang='+L;</script>
</main></body></html>
