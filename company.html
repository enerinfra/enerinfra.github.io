<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<title>회사소개 | ㈜에너인프라</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html{color-scheme:only light}
:root{
  --bg:#F5F6F8;--bg2:#FFFFFF;--dark:#0E1B33;--dark2:#111A2B;
  --ink:#0F141C;--ink2:#5D6674;--ink3:#8B939F;
  --navy:#14346E;--amber:#F2A31B;--amber-l:#F5B93F;--teal:#1E9C82;
  --line:rgba(15,20,28,.1);--line-d:rgba(255,255,255,.1);
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Hiragino Sans','Yu Gothic UI','Malgun Gothic',sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{width:min(1120px,90vw);margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 상단 내비 ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:80;height:56px;
  background:rgba(245,246,248,.85);backdrop-filter:blur(14px);color:var(--ink);
  border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;height:56px;gap:28px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-weight:800;letter-spacing:-.02em;font-size:15px}
.brand svg{width:22px;height:22px}
.nav{display:flex;gap:26px}
.nav a{font-size:13px;font-weight:500;opacity:.8}
.nav a:hover{opacity:1}
.lang{display:flex;gap:2px;border:1px solid currentColor;border-radius:999px;padding:2px;opacity:.9}
.lang button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 9px;border:0;border-radius:999px;background:none;color:inherit;cursor:pointer;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--amber);color:#0E1B33}
.burger{display:none;border:0;background:none;cursor:pointer;padding:6px}
.burger span{display:block;width:20px;height:2px;background:currentColor;margin:4px 0}

/* ---------- 히어로 ---------- */
.hero{min-height:100vh;background:radial-gradient(ellipse 70% 55% at 50% 66%,#E6E9EE 0%,var(--bg) 62%);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:120px 5vw 60px;position:relative;overflow:hidden}
.hero .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--amber);margin-bottom:22px}
.hero h1{font-size:clamp(34px,6vw,72px);font-weight:850;letter-spacing:-.045em;line-height:1.08;max-width:18ch}
.hero .sub{margin-top:18px;font-size:clamp(15px,1.6vw,19px);color:var(--ink2);max-width:44ch}
.hero .ctas{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid transparent;transition:transform .18s,background .18s}
.btn:hover{transform:translateY(-1px)}
.btn-amber{background:var(--amber);color:#0E1B33}
.btn-amber:hover{background:var(--amber-l)}
.btn-line{border-color:rgba(15,20,28,.25);color:var(--ink);background:#fff}
.btn-line:hover{border-color:var(--ink)}
.hero-product{margin-top:56px;width:min(560px,86vw);position:relative}
.hero-glow{position:absolute;inset:-40px -80px;background:radial-gradient(ellipse at 50% 40%,rgba(224,147,5,.12),transparent 60%);pointer-events:none}
.scroll-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink3)}
.scroll-hint::after{content:"";display:block;width:1px;height:26px;background:linear-gradient(var(--ink3),transparent);margin:8px auto 0}

/* ---------- 제품 렌더 (CSS) ---------- */
.panel{position:relative;background:linear-gradient(165deg,#F8F9FA,#D9DEE4);border:1px solid #B8C0CA;border-radius:16px;padding:20px;
  box-shadow:0 30px 60px -28px rgba(15,20,28,.45),0 0 0 1px rgba(255,255,255,.6) inset}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#A8B1BC);border:1px solid rgba(0,0,0,.18)}
.screw.tl{top:8px;left:8px}.screw.tr{top:8px;right:8px}.screw.bl{bottom:8px;left:8px}.screw.br{bottom:8px;right:8px}
.bks{display:flex;gap:6px;margin-bottom:16px;padding:0 6px}
.bk{flex:1;height:40px;border-radius:4px;background:linear-gradient(#FDFDFE,#E6E9EE);border:1px solid #C3CAD3;position:relative}
.bk::after{content:"";position:absolute;left:22%;right:22%;top:7px;height:15px;border-radius:2px;background:#B7BEC8}
.bk.on::after{background:var(--amber);box-shadow:0 0 8px rgba(224,147,5,.5)}
.lcd{background:#08111D;border-radius:9px;padding:20px 22px 18px;border:1px solid #03070D;
  box-shadow:inset 0 14px 30px rgba(0,0,0,.6);position:relative;overflow:hidden;text-align:left}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd-top{display:flex;justify-content:space-between;margin-bottom:12px}
.lcd-brand{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:#586B82}
.lcd-tag{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--amber-l);border:1px solid rgba(245,185,63,.4);border-radius:3px;padding:2px 7px}
.lcd-label{font-size:11px;color:#6A7B93;margin-bottom:6px}
.readout{display:flex;align-items:baseline;gap:8px}
.readout .v{font-family:var(--mono);font-size:clamp(40px,6vw,56px);font-weight:600;color:#F4F7FA;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.readout .u{font-family:var(--mono);font-size:14px;color:#7F8FA3}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cell{background:rgba(255,255,255,.05);border-radius:6px;padding:10px 12px}
.cell .k{font-size:10px;color:#6A7B93}
.cell .v{font-family:var(--mono);font-size:19px;color:#E8EEF5;margin-top:3px;font-variant-numeric:tabular-nums}
.cell.gen .v{color:#4FD1B4}.cell.amb .v{color:var(--amber-l)}
.gauge{margin-top:14px}
.gauge .k{display:flex;justify-content:space-between;font-size:10px;color:#6A7B93;margin-bottom:6px}
.gauge .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.gauge .bar i{display:block;height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,#1E9C82,#F2A31B 65%,#E04B3A)}
.gauge .marks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:#4F6079;margin-top:5px}

/* ---------- 서브 내비 ---------- */
.subnav{position:sticky;top:56px;z-index:70;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.subnav-in{display:flex;align-items:center;height:48px;gap:24px}
.subnav b{font-weight:800;letter-spacing:.06em;font-size:13px;margin-right:auto}
.subnav a{font-size:13px;color:var(--ink2);padding:4px 0;border-bottom:2px solid transparent}
.subnav a.on{color:var(--ink);border-bottom-color:var(--amber)}

/* ---------- 장면 ---------- */
.scene{padding:120px 0}
.scene.dark{background:#EEF0F3;color:var(--ink)}
.scene.white{background:var(--bg2)}
.scene-head{text-align:center;max-width:720px;margin:0 auto 56px}
.scene-head .kick{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--amber);margin-bottom:16px}
.scene-head h2{font-size:clamp(28px,4.2vw,50px);font-weight:850;letter-spacing:-.04em;line-height:1.12}
.scene-head p{margin-top:16px;font-size:clamp(15px,1.5vw,18px);color:var(--ink2)}
.dark .scene-head p{color:var(--ink2)}
.visual{max-width:920px;margin:0 auto}

/* 장면 1 — 3단계 설치 */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px 26px;text-align:center}
.step svg{width:120px;height:120px;margin:0 auto 18px}
.step .n{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber);font-weight:700}
.step h3{font-size:17px;font-weight:750;margin:8px 0 6px;letter-spacing:-.02em}
.step p{font-size:13.5px;color:var(--ink2)}

/* 장면 2 — 회로별 */
.circuits{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.clist{display:grid;gap:12px}
.crow{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:14px;font-size:14px}
.crow .nm{color:var(--ink);font-weight:600}
.crow .tr{height:10px;border-radius:5px;background:rgba(15,20,28,.08);overflow:hidden}
.crow .tr i{display:block;height:100%;background:var(--amber);border-radius:5px;transition:width 1s ease}
.crow .tr.g i{background:var(--teal)}
.crow .kw{font-family:var(--mono);font-size:13px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.demo-note{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);margin-top:18px}

/* 장면 3 — 3색 판단 */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:820px;margin:0 auto}
.tri div{border-radius:14px;padding:26px 22px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end}
.tri .ok{background:linear-gradient(160deg,#1E9C82,#136B58)}
.tri .cau{background:linear-gradient(160deg,#F2A31B,#B07200)}
.tri .dng{background:linear-gradient(160deg,#E04B3A,#A6301F)}
.tri b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tri span{font-size:13px;opacity:.9;margin-top:6px}

/* 숫자 스트립 */
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2)}
.strip-in{display:grid;grid-template-columns:repeat(4,1fr)}
.strip div{padding:40px 20px;text-align:center;border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip .big{font-family:var(--mono);font-size:clamp(30px,4vw,44px);font-weight:600;letter-spacing:-.03em;color:var(--ink);line-height:1}
.strip .big small{font-size:.45em;color:var(--ink3);margin-left:3px}
.strip .lab{font-size:12.5px;color:var(--ink2);margin-top:10px}

/* 사양표 */
.spec{width:100%;max-width:820px;margin:0 auto;border-collapse:collapse}
.spec th,.spec td{padding:15px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px}
.spec th{width:34%;font-weight:600;color:var(--ink2)}
.spec td{font-family:var(--mono);font-size:14px}

/* 일본 장면 */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:720px;margin:0 auto}
.dual div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px}
.dual .k{font-size:12px;color:var(--ink2)}
.dual .v{font-family:var(--mono);font-size:44px;font-weight:600;color:var(--ink);letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.dual .v small{font-size:14px;color:var(--ink3);margin-left:4px}
.dual .gen .v{color:var(--teal)}
.rmap{display:flex;justify-content:center;gap:0;margin-top:44px;flex-wrap:wrap}
.rmap div{padding:14px 26px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink2);position:relative}
.rmap div b{display:block;font-family:var(--mono);color:var(--amber);font-size:12px;letter-spacing:.1em;margin-bottom:4px}
.rmap div+div{border-left:0}

/* 회사 */
.co{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.co h2{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
.co p{margin-top:16px;color:var(--ink2);font-size:15.5px}
.co .spec th,.co .spec td{padding:12px 10px;font-size:13.5px}
.co .spec td{font-family:var(--sans)}

/* 문의 */
.cta{background:var(--bg2);color:var(--ink);text-align:center;padding:110px 5vw;border-top:1px solid var(--line)}
.cta h2{font-size:clamp(28px,4vw,46px);font-weight:850;letter-spacing:-.04em}
.cta p{color:var(--ink2);margin-top:14px;font-size:16px}
.cta .line{margin-top:34px;font-family:var(--mono);font-size:13px;color:var(--ink2);display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.cta .line a{color:var(--navy);border-bottom:1px solid rgba(22,48,92,.3)}
footer{background:#EEF0F3;color:var(--ink3);font-size:12px;padding:26px 0;border-top:1px solid var(--line)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* 등장 애니메이션 */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

@media(max-width:900px){
  .steps,.tri,.circuits,.dual,.co{grid-template-columns:1fr}
  .strip-in{grid-template-columns:1fr 1fr}
  .strip div:nth-child(2){border-right:0}
  .strip div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .scene{padding:84px 0}
  .subnav a{display:none}
}
@media(max-width:720px){
  .nav{display:none}
  .nav.open{display:flex;position:absolute;top:56px;left:0;right:0;flex-direction:column;background:#fff;padding:16px 5vw;gap:14px;border-bottom:1px solid var(--line)}
  .burger{display:block;order:3}
  .crow{grid-template-columns:84px 1fr 60px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}

/* ---------- 서브 페이지 공통 ---------- */
.ph{padding:130px 0 60px;text-align:center}
.ph .kick{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--amber);margin-bottom:16px}
.ph h1{font-size:clamp(32px,5vw,58px);font-weight:850;letter-spacing:-.045em;line-height:1.1}
.ph p{margin-top:16px;color:var(--ink2);font-size:clamp(15px,1.5vw,18px);max-width:52ch;margin-left:auto;margin-right:auto}
.sec{padding:80px 0}
.sec.alt{background:#EEF0F3}
.sec.white{background:var(--bg2)}
.sh{margin-bottom:36px}
.sh .kick{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--amber);margin-bottom:12px}
.sh h2{font-size:clamp(24px,3.2vw,38px);font-weight:820;letter-spacing:-.035em;line-height:1.2}
.sh p{margin-top:12px;color:var(--ink2);max-width:60ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px}
.fcard .ic{width:40px;height:40px;border-radius:10px;background:#FFF4DE;display:grid;place-items:center;margin-bottom:16px}
.fcard .ic svg{width:22px;height:22px;stroke:var(--amber);fill:none;stroke-width:2;stroke-linecap:round}
.fcard h3{font-size:16.5px;font-weight:750;letter-spacing:-.02em;margin-bottom:6px}
.fcard p{font-size:14px;color:var(--ink2)}
.callouts{position:relative;max-width:560px;margin:0 auto}
.co-list{display:grid;gap:14px}
.co-item{display:flex;gap:14px;align-items:flex-start}
.co-item b{font-family:var(--mono);font-size:11px;color:#fff;background:var(--navy);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex:none;margin-top:2px}
.co-item h4{font-size:15px;font-weight:700;letter-spacing:-.02em}
.co-item p{font-size:13.5px;color:var(--ink2)}
.faq{max-width:820px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:16px;letter-spacing:-.02em;list-style:none;display:flex;justify-content:space-between;align-items:center}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--amber);font-size:20px}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:12px;color:var(--ink2);font-size:14.5px;max-width:65ch}
.tl2{border-left:2px solid #C3CAD3;padding-left:28px;display:grid;gap:26px;max-width:720px}
.tl2 div{position:relative}
.tl2 div::before{content:"";position:absolute;left:-35px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy)}
.tl2 div.now::before{background:var(--amber);border-color:var(--amber)}
.tl2 .d{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--amber);font-weight:700}
.tl2 h4{font-size:16px;font-weight:750;margin:5px 0 4px;letter-spacing:-.02em}
.tl2 p{font-size:14px;color:var(--ink2)}
.quote{max-width:760px;margin:0 auto;font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:-.03em;line-height:1.4;text-align:center}
.quote small{display:block;margin-top:18px;font-size:13px;color:var(--ink3);font-weight:500;font-family:var(--mono);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:13px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:700;margin-right:6px}
.news{max-width:820px;margin:0 auto;display:grid;gap:0}
.news a{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:24px 0;border-bottom:1px solid var(--line);align-items:baseline}
.news .d{font-family:var(--mono);font-size:12px;color:var(--ink3);letter-spacing:.06em}
.news h3{font-size:17px;font-weight:750;letter-spacing:-.02em}
.news p{font-size:14px;color:var(--ink2);margin-top:4px}
.news .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--amber);margin-bottom:6px}
.form{max-width:640px;margin:0 auto}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.types label{border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;font-size:13.5px;font-weight:600;cursor:pointer;background:#fff}
.types input{display:none}
.types input:checked+span{color:var(--navy)}
.types label:has(input:checked){border-color:var(--navy);box-shadow:0 0 0 2px rgba(22,48,92,.15)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld input,.fld textarea{width:100%;font-family:var(--sans);font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--navy);outline-offset:0;border-color:transparent}
.fld textarea{min-height:140px;resize:vertical}
.form .btn{width:100%;justify-content:center;padding:15px}
.fnote{font-size:12.5px;color:var(--ink3);margin-top:14px;text-align:center}
.map{background:#E3E7EC;border-radius:14px;height:260px;display:grid;place-items:center;color:var(--ink3);font-size:13px;text-align:center;padding:20px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.types{grid-template-columns:1fr 1fr}.news a{grid-template-columns:1fr;gap:6px}}

.nav a.on{opacity:1;font-weight:700;color:var(--navy)}</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap top-in">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 250 40" aria-hidden="true" style="width:auto;height:22px"><rect x="0" y="12" width="14" height="4" rx="2" fill="#14346E"/><rect x="0" y="24" width="14" height="4" rx="2" fill="#14346E"/><rect x="16" y="2" width="36" height="36" rx="8" fill="#F2A31B"/><text x="62" y="32" font-family="Pretendard Variable,Pretendard,'Noto Sans KR','Noto Sans JP',sans-serif" font-weight="900" font-size="34" letter-spacing="-1" fill="#14346E">ENERINFRA</text></svg>

const P=new URLSearchParams(location.search);
let LANG=['ko','ja','en'].includes(P.get('lang'))?P.get('lang'):'ko';
function apply(lang){
  LANG=lang;const d=I18N[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{const v=d[el.dataset.t];if(v!==undefined)el.innerHTML=v;});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  document.querySelectorAll('a[href$=".html"],a[href*=".html#"]').forEach(a=>{
    const u=a.getAttribute('href').split('?')[0];
    a.setAttribute('href',lang==='ko'?u:u.replace(/(#.*)?$/,'?lang='+lang+'$1'));
  });
  if(typeof onLang==='function')onLang(lang);
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.lang)));
document.getElementById('burger').addEventListener('click',()=>document.getElementById('nav').classList.toggle('open'));

document.querySelectorAll('.rv').forEach(el=>io.observe(el));
